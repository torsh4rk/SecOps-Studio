name: Agro AI Guardian tests
on:
  push:
    paths:
      - 'agro-ai-guardian/**'
      - '.github/workflows/agro-ai-guardian-tests.yml'
  pull_request:
    paths:
      - 'agro-ai-guardian/**'
      - '.github/workflows/agro-ai-guardian-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agro-ai-guardian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Sample detection
        run: python -m agro_guardian --input examples/events.jsonl
