name: Threat Intel MCP — offline tests

on:
  push:
    paths:
      - 'torsh4rk-threat-intel-mcp/**'
      - '.github/workflows/threat-intel-mcp-tests.yml'
  pull_request:
    paths:
      - 'torsh4rk-threat-intel-mcp/**'
      - '.github/workflows/threat-intel-mcp-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.11–3.13
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile server
        working-directory: torsh4rk-threat-intel-mcp
        run: python -m py_compile server.py
      - name: Run offline unit tests
        working-directory: torsh4rk-threat-intel-mcp
        run: python -m unittest discover -s tests -v
